name: Update Publications

on:
  schedule:
    # Runs every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:   # allows manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch latest publications
        run: python fetch_publications.py

      - name: Commit updated publications.json (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json publications.js
          if git diff --cached --quiet; then
            echo "No changes to publications.json"
          else
            git commit -m "Auto-update publications from Google Scholar [skip ci]"
            git push
          fi
